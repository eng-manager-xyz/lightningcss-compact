name: Release CLI

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      version: "${{ steps.version.outputs.version }}"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to Cargo version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
              raise RuntimeError('Expected a version tag, got ' + tag)
          metadata = json.loads(subprocess.check_output([
              'cargo', 'metadata', '--locked', '--format-version', '1', '--no-deps',
          ]))
          package = next(p for p in metadata['packages'] if p['name'] == 'lightningcss-compact')
          if tag != 'v' + package['version']:
              raise RuntimeError('Release tag does not match Cargo.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('version=' + package['version'] + '\n')
          PY

  archive:
    name: "CLI / ${{ matrix.target }}"
    needs: [checks, tag]
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"
      - name: Test on native target
        run: cargo test --locked --all-features --target ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --locked --features cli --target ${{ matrix.target }}
      - name: Smoke and package executable
        env:
          RELEASE_TARGET: "${{ matrix.target }}"
          RELEASE_VERSION: "${{ needs.tag.outputs.version }}"
        run: |
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import zipfile

          target = os.environ['RELEASE_TARGET']
          version = os.environ['RELEASE_VERSION']
          suffix = '.exe' if os.name == 'nt' else ''
          binary = pathlib.Path('target') / target / 'release' / ('lightningcss-compact' + suffix)
          subprocess.run([str(binary), '--version'], check=True)
          subprocess.run([str(binary), '--help'], check=True)
          name = 'lightningcss-compact-' + version + '-' + target
          directory = pathlib.Path('release') / name
          directory.mkdir(parents=True, exist_ok=True)
          for file in [binary, pathlib.Path('README.md'), pathlib.Path('CONTRIBUTING.md'), pathlib.Path('CHANGELOG.md'),
                       pathlib.Path('LICENSE-MIT'), pathlib.Path('LICENSE-APACHE'), pathlib.Path('NOTICE'),
                       pathlib.Path('THIRD-PARTY.md')]:
              shutil.copy2(file, directory / file.name)
          shutil.copytree('licenses', directory / 'licenses', dirs_exist_ok=True)
          shutil.copytree('docs', directory / 'docs', dirs_exist_ok=True)
          shutil.copytree('examples', directory / 'examples', dirs_exist_ok=True)
          if os.name == 'nt':
              archive = pathlib.Path(str(directory) + '.zip')
              with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED) as output:
                  for file in sorted(directory.rglob('*')):
                      if file.is_file():
                          output.write(file, name + '/' + file.relative_to(directory).as_posix())
          else:
              archive = pathlib.Path(str(directory) + '.tar.gz')
              with tarfile.open(archive, 'w:gz') as output:
                  output.add(directory, arcname=name)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(str(archive) + '.sha256').write_text(
              digest + '  ' + archive.name + '\n', encoding='utf-8'
          )
          # Test the actual archive installation, independently of the original
          # build tree. Validate every entry before extracting it on any host.
          def validate_member(member):
              parts = pathlib.PurePosixPath(member).parts
              if member.startswith('/') or '\\' in member or '..' in parts or not parts or parts[0] != name:
                  raise RuntimeError('Unsafe CLI archive member: ' + member)

          with tempfile.TemporaryDirectory(prefix='lightningcss-compact-archive-') as temporary:
              unpacked = pathlib.Path(temporary)
              if os.name == 'nt':
                  with zipfile.ZipFile(archive) as package:
                      for member in package.infolist():
                          validate_member(member.filename)
                          if (member.external_attr >> 16) & 0o170000 == 0o120000:
                              raise RuntimeError('Symlink in CLI archive: ' + member.filename)
                      package.extractall(unpacked)
              else:
                  with tarfile.open(archive, 'r:gz') as package:
                      for member in package.getmembers():
                          validate_member(member.name)
                          if not (member.isfile() or member.isdir()):
                              raise RuntimeError('Non-file entry in CLI archive: ' + member.name)
                      package.extractall(unpacked)
              installed = unpacked / name
              executable = installed / binary.name
              subprocess.run([str(executable), '--version'], check=True)
              subprocess.run([str(executable), '--help'], check=True, stdout=subprocess.PIPE)
              output = unpacked / 'output'
              subprocess.run([
                  str(executable), 'build', '--project', str(installed / 'examples/project.json'),
                  '--out-dir', str(output),
              ], check=True, cwd=installed, stdout=subprocess.PIPE)
              for expected in ['manifest.json', 'report.json', 'bindings.json', 'result.json',
                               'css/cards.css', 'css/cards.css.map']:
                  if not (output / expected).is_file():
                      raise RuntimeError('Archive-installed CLI did not emit ' + expected)
              for expected in ['CONTRIBUTING.md', 'docs/ALGORITHM.md', 'examples/bundle.rs',
                               'licenses/third-party/README.md', 'licenses/third-party/inventory.json']:
                  if not (installed / expected).is_file():
                      raise RuntimeError('CLI archive is missing ' + expected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: "cli-${{ matrix.target }}"
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.sha256
          if-no-files-found: error

  draft:
    name: Draft GitHub release
    needs: [archive, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release
          merge-multiple: true
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check ./*.sha256
      - name: Create draft release
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_VERSION: "${{ needs.tag.outputs.version }}"
        run: |
          cat > release-notes.md <<'EOF'
          Native CLI archives for:

          - Linux GNU: x86_64 and aarch64
          - macOS: x86_64 and aarch64
          - Windows MSVC: x86_64

          Each executable was built, archived, extracted into a fresh directory,
          and used to compile the shipped example on its native host. Archives
          include both project licenses, copied dependency notices, docs, examples,
          and SHA-256 checksums. Linux GNU binaries are built on Ubuntu 24.04 and
          require a compatible glibc runtime; they are not musl/static executables.
          Native macOS hosts are macOS 14 (arm64) and macOS 15 (x86_64); Windows
          uses the Windows Server 2022 MSVC runner. Build from Cargo source when
          your runtime is not compatible with those prebuilt archives.

          This draft does not publish the Cargo package to crates.io. Review the
          changelog and release assets before publishing.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "lightningcss-compact $RELEASE_VERSION" --notes-file release-notes.md
